<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GR Mod</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #15171c; color: #e8e6e1; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 34rem; padding: 2rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .5rem; }
  p { margin: .5rem 0; color: #a9a7a1; }
  code { color: #e8e6e1; }
</style>
<script src="/host.js"></script>
</head>
<body>
<main>
  <h1>GR Mod shell</h1>
  <p>This is the placeholder page. The real user interface has not been built into
     this copy of the shell yet: build the UI, then run <code>shell/build.sh</code> again.</p>
  <p id="status">Contacting the shell&hellip;</p>
</main>
<script>
  (function () {
    var host = window.__GRMOD_HOST__, status = document.getElementById("status");
    if (!host) { status.textContent = "host.js did not load."; return; }
    function ping() {
      fetch("/api/ping", { headers: { "X-GRMod-Token": host.token } })
        .then(function (r) { return r.json(); })
        .then(function (j) { status.textContent = "Shell " + j.version + " (" + host.kind + ", " + host.os + ") is running."; })
        .catch(function () { status.textContent = "The shell is not answering."; });
    }
    ping();
    setInterval(ping, 5000); // also the heartbeat that keeps a browser-hosted shell alive
  })();
</script>
</body>
</html>
